spring:
  application:
    name: ccoj-user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CCOJ_DB_URL:jdbc:mysql://localhost:3306/ccoj}
    username: ${CCOJ_DB_USERNAME:root}
    password: ${CCOJ_DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      connect-timeout: 3s
      timeout: 3s
  session:
    timeout: 30m
    data:
      redis:
        namespace: ccoj:session
        repository-type: indexed
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRESS:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}


mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8000
  servlet:
    session:
      cookie:
        name: CCOJ_SESSION
        path: /
        http-only: true
        same-site: lax

springdoc:
  api-docs:
    version: openapi_3_0
    enabled: ${CCOJ_API_DOCS_ENABLED:false}
    path: /user/docs/openapi
  paths-to-match:
    - /user/**
  paths-to-exclude:
    - /inner/**
  override-with-generic-response: false
